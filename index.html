<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar Order Status</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      width: 220px;
      margin: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Check Your Order Status</h1>

  <p>Enter your order number below.</p>

  <input
    type="text"
    id="orderNumber"
    placeholder="Example: ORD001"
  >

  <button type="button" onclick="searchOrder()">
    Check Order
  </button>

  <p id="result"></p>

  <script>
    const orders = {
      "ORD001": "Processing",
      "ORD002": "Shipped",
      "ORD003": "Out for Delivery",
      "ORD004": "Delivered",
      "ORD005": "Processing",
      "ORD006": "Shipped",
      "ORD007": "Delivered",
      "ORD008": "Out for Delivery",
      "ORD009": "Processing",
      "ORD010": "Shipped"
    };

    function searchOrder() {
      const input = document.getElementById("orderNumber");
      const result = document.getElementById("result");

      const orderNumber = input.value.trim().toUpperCase();

      if (orderNumber === "") {
        result.textContent = "Please enter an order number.";
        return;
      }

      if (orders[orderNumber]) {
        result.textContent =
          "Order " + orderNumber + " status: " + orders[orderNumber];
      } else {
        result.textContent =
          "Order not found. Please check your order number.";
      }
    }
  </script>

</body>
</html>
